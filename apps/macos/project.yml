name: Todz
options:
  bundleIdPrefix: dev.todz
  deploymentTarget:
    macOS: "14.0"
settings:
  configs:
    Debug:
      TODZ_APP_BUNDLE_IDENTIFIER: dev.todz.Todz.debug
      TODZ_WIDGETS_BUNDLE_IDENTIFIER: dev.todz.Todz.debug.widgets
      TODZ_APP_GROUP: dev.todz.debug
      TODZ_ALLOWS_LOCAL_NETWORKING: "YES"
    Release:
      TODZ_APP_BUNDLE_IDENTIFIER: dev.todz.Todz
      TODZ_WIDGETS_BUNDLE_IDENTIFIER: dev.todz.Todz.widgets
      TODZ_APP_GROUP: dev.todz
      TODZ_ALLOWS_LOCAL_NETWORKING: "NO"
packages:
  TodzKit:
    path: TodzKit
targets:
  Todz:
    type: application
    platform: macOS
    sources: [Todz, Copy]
    dependencies:
      - package: TodzKit
      - target: TodzWidgets
    settings:
      base:
        PRODUCT_NAME: Todz
        PRODUCT_BUNDLE_IDENTIFIER: $(TODZ_APP_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: XFWR794VS8
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          TODZ_API_BASE_URL: http://localhost:8787
        Release:
          TODZ_API_BASE_URL: https://api.todz.app
    entitlements:
      path: Todz/Todz.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(TODZ_APP_GROUP)
    info:
      path: Todz/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TodzAPIBaseURL: $(TODZ_API_BASE_URL)
        TodzAppGroup: $(TeamIdentifierPrefix)$(TODZ_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: dev.todz.Todz
            CFBundleURLSchemes: [todz]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: $(TODZ_ALLOWS_LOCAL_NETWORKING)
  TodzWidgets:
    type: app-extension
    platform: macOS
    sources: [TodzWidgets, Copy, Todz/Assets.xcassets]
    dependencies:
      - package: TodzKit
    settings:
      base:
        PRODUCT_NAME: TodzWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(TODZ_WIDGETS_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: XFWR794VS8
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: TodzWidgets/TodzWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(TODZ_APP_GROUP)
    info:
      path: TodzWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TodzAppGroup: $(TeamIdentifierPrefix)$(TODZ_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Todz:
    build:
      targets:
        Todz: all
    test:
      targets:
        - package: TodzKit/TodzKitTests
