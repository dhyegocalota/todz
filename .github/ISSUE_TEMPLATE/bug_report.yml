name: 🐛 Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: The agent or MCP client you connected, and its version.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - MCP server
        - macOS app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove keys, tokens and task content before you paste.
