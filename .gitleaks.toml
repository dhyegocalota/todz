title = "todz"

[extend]
useDefault = true

[[rules]]
id = "todz-oauth-token"
description = "A todz OAuth access or refresh token"
regex = '''todz-(?:at|rt)_[A-Za-z0-9_-]{43}'''
keywords = ["todz-at_", "todz-rt_"]

[allowlist]
description = "The exact placeholder strings the repository ships on purpose, each anchored to the whole secret"
regexes = [
  '''^todz-test-secret-with-at-least-32-characters$''',
  '''^todz_yMnKy8zNzs_Q0dLT1NXW19jZ2tvc3d7f4OHi4-Tl5uc$''',
  '''^todz-owner_yMnKy8zNzs_Q0dLT1NXW19jZ2tvc3d7f4OHi4-Tl5uc$''',
  '''^Zm9yLXByZXZpZXctb25seS1ub3QtYS1yZWFsLXRva2Vu$''',
  '''^BYXfy/qfQvJmxxD6JPs8gelvFwACXZ8xhhcG2p/fpYY=$''',
]
